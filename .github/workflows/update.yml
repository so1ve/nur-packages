name: Update

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31

      - name: Update sources
        run: nix run .#update

      - name: Read version
        id: version
        run: echo "version=$(jq --raw-output .version sources.json)" >>"$GITHUB_OUTPUT"

      - name: Open update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-ab-download-manager
          delete-branch: true
          commit-message: "package: update to ${{ steps.version.outputs.version }}"
          title: "package: update to ${{ steps.version.outputs.version }}"
          body: |
            Automated update from the latest official AB Download Manager release.
